<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f1e1f" />
    <meta
      name="description"
      content="Plataforma inclusiva para descobrir e divulgar eventos culturais, esportivos e comunitários da sua região. Fortalece o turismo e a economia local."
    />

    <link rel="canonical" href="https://eventos-regiao.vercel.app/" />

    <!-- Open Graph / compartilhamento em redes sociais -->
    <meta property="og:title" content="Eventos Região — Turismo e Cultura Local" />
    <meta
      property="og:description"
      content="Descubra e divulgue eventos culturais, esportivos e comunitários da sua região."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Eventos Região" />
    <meta property="og:url" content="https://eventos-regiao.vercel.app/" />
    <meta property="og:image" content="https://eventos-regiao.vercel.app/api/og" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eventos Região — Turismo e Cultura Local" />
    <meta
      name="twitter:description"
      content="Descubra e divulgue eventos culturais, esportivos e comunitários da sua região."
    />
    <meta name="twitter:image" content="https://eventos-regiao.vercel.app/api/og" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Eventos Região — Turismo e Cultura Local</title>

    <!-- Aplica o tema antes de pintar a tela, evitando "flash" de tema errado -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tema')
          var escuro =
            t === 'escuro' ||
            ((t === 'sistema' || !t) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (escuro) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
